<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>GZ AI OS</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #0B0C0E; color: #8D929A;
         font-family: system-ui, sans-serif; display: flex; align-items: center;
         justify-content: center; font-size: 14px; }
</style>
</head>
<body>
<div id="s">Opening&hellip;</div>
<script src="./gz.js"></script>
<script>
(function () {
  var pw = sessionStorage.getItem('gzpw');
  if (!pw) { location.replace('./'); return; }
  GZ.load('./d/overview.json', pw).then(function (html) {
    document.open(); document.write(html); document.close();
  }).catch(function () {
    sessionStorage.removeItem('gzpw');
    location.replace('./');
  });
})();
</script>
</body>
</html>
